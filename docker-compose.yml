services:
  test-service:
    image: hello-world
    container_name: test-service
    restart: "no"


  rsync:
    image: alpine:latest
    container_name: rsync_backup
    environment:
      - TZ=Europe/Madrid
    volumes:
      - /Volumes/DATA_M2:/data_m2:ro
      - /Volumes/DATA_SSD/Backup_m2:/backup
    entrypoint: >
      sh -c "apk add --no-cache rsync tzdata;
      ln -snf /usr/share/zoneinfo/Europe/Madrid /etc/localtime;
      echo Europe/Madrid > /etc/timezone;
      while true;
      do
        echo \"[$(date '+%Y-%m-%d %H:%M:%S')] Iniciando sincronización...\";
        rsync -avz --delete --copy-unsafe-links /data_m2/ /backup/ 2>&1 | tee /backup/rsync.log | sed \"s/^/[$(date '+%Y-%m-%d %H:%M:%S')] /\" ;
        echo \"[$(date '+%Y-%m-%d %H:%M:%S')] Esperando 20 minutos antes de la próxima sincronización...\";
        sleep 1200;
      done"
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  stock_screener:
    build:
      context: ./Mis_documentos_importantes/PROYECTOS/stock_screener/streamlit
      dockerfile: Dockerfile
    container_name: stock_screener
    ports:
      - "8501:8501"
    volumes:
      - ./Mis_documentos_importantes/PROYECTOS/stock_screener/streamlit:/app
    environment:
      - TZ=Europe/Madrid
      - DB_USER=airflow
      - DB_PASS=airflow
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=airflow
    depends_on:
      - postgres
    restart: unless-stopped
