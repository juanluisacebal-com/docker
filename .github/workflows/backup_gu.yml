name: Sync gu to Github

on:
  schedule:
    - cron: '0 3 * * *' # Todos los días a las 03:00 AM
  workflow_dispatch: # Permite ejecutarlo a mano desde el botón

jobs:
  backup:
    runs-on: self-hosted
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.PAT_PROYECTOS }}

      - name: Configurar Git para Pushear al Privado
        run: |
          cd proyectos
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_PROYECTOS }}@github.com/juanluisacebal/proyectos.git
          
          # Nos aseguramos de estar en main
          git checkout main
          git pull origin main

      - name: Recopilar docker-compose de gu
        run: |
          echo "Buscando contenedores en gu de forma precisa..."
          
          # Obtenemos las rutas exactas (working_dir) de los proyectos desde los contenedores en ejecución
          # Limpiamos duplicados con sort -u
          project_dirs=$(docker ps -q | xargs docker inspect --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' | grep -v '^$' | sort -u)
          
          for dir in $project_dirs; do
            echo "Inspeccionando proyecto en: $dir"
            
            # Buscamos cualquier archivo yaml/yml en esa ruta exacta (profundidad 1)
            # Evitamos procesar la carpeta proyectos en sí misma
            if [[ "$dir" != *"/proyectos" ]]; then
              
              project_name=$(basename "$dir")
              clean_name=${project_name##*.}
              
              mkdir -p "proyectos/$clean_name"
              
              # Copiamos cualquier archivo de compose (yml o yaml)
              find "$dir" -maxdepth 1 -type f \( -name "*.yml" -o -name "*.yaml" \) 2>/dev/null | while read file; do
                echo "-> Copiando backup de: $clean_name ($(basename "$file"))"
                cp "$file" "proyectos/$clean_name/$(basename "$file")"
                
                # Ofuscamos contraseñas, tokens y secretos en el archivo copiado
                # Busca cualquier variable que contenga PASSWORD, SECRET, TOKEN, KEY, AUTH o USER y cambia su valor por "***"
                sed -i -E 's/([A-Za-z0-9_]*(PASSWORD|SECRET|TOKEN|KEY|AUTH|USER)[A-Za-z0-9_]*[:=])[ \t]*"?.*"?/\1 "***"/g' "proyectos/$clean_name/$(basename "$file")"
              done
              
              # Si existe archivo .env, lo copiamos por seguridad (y lo ofuscamos)
              if [ -f "$dir/.env" ]; then
                cp "$dir/.env" "proyectos/$clean_name/.env"
                sed -i -E 's/([A-Za-z0-9_]*(PASSWORD|SECRET|TOKEN|KEY|AUTH|USER)[A-Za-z0-9_]*[:=])[ \t]*"?.*"?/\1 "***"/g' "proyectos/$clean_name/.env"
              fi
            fi
          done

      - name: Commit y Push si hay cambios
        run: |
          cd proyectos
          
          # Vemos si hay archivos nuevos o modificados
          if [[ -n $(git status -s) ]]; then
            echo "Se han detectado cambios. Subiendo a Github..."
            git add .
            git commit -m "chore(backup): sincronización automática desde la UI de gu"
            git push origin main
            
            # Ahora que el submódulo se ha actualizado, hacemos commit en el repo público docker
            cd ..
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add proyectos
            git commit -m "chore(backup): actualizar submódulo con los últimos backups de gu"
            # Hacemos push usando el token general (aquí si usa el GITHUB_TOKEN del runner)
            git push origin main
          else
            echo "No hay contenedores nuevos ni modificados. Nada que subir."
          fi
