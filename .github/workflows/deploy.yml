name: Deploy to DXP2800 NAS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Levantar el entorno con docker compose
        run: |
          cd proyectos/stock_screener
          docker compose down
          docker compose up -d --build
