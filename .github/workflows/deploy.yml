name: Deploy to gu

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    # 1ª Capa de Seguridad: Cancelar automáticamente si el repositorio no es el original,
    # o si el commit lo ha hecho alguien que no sea juanluisacebal
    if: github.repository == 'juanluisacebal-com/docker' && github.actor == 'juanluisacebal'
    
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          token: ${{ secrets.PAT_PROYECTOS }}

      - name: Get changed files in proyectos/
        id: changed-files
        run: |
          cd proyectos
          # Buscamos absolutamente todos los docker-compose.yml
          ALL_FILES=$(find . -type f \( -name "docker-compose.yml" -o -name "docker-compose.yaml" \) | sed 's|^./||')
          ALL_CHANGED=""
          for f in $ALL_FILES; do
            ALL_CHANGED="$ALL_CHANGED proyectos/$f"
          done
          echo "Archivos detectados: $ALL_CHANGED"
          
          if [ -n "$ALL_CHANGED" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
            echo "all_changed_files=$ALL_CHANGED" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Guardián de Secretos (Anti-Secrets y Auto-Revert)
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Escaneando archivos en busca de secretos expuestos..."
          has_secrets=false
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            # Busca claves sensibles que NO usen variables de entorno ($VAR o ${VAR})
            # Excluimos "USER" explícitamente según lo solicitado.
            if grep -iE '[a-zA-Z0-9_]*(PASSWORD|SECRET|TOKEN|KEY|AUTH)[a-zA-Z0-9_]*[ \t]*[:=]' "$file" | grep -qvE '\$'; then
              echo "::error file=$file::SECRETO EXPUESTO DETECTADO EN: $file"
              has_secrets=true
            fi
          done
          
          if [ "$has_secrets" = true ]; then
            echo "¡Alarma de seguridad! Abortando despliegue y revirtiendo commit..."
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            # Deshacemos el commit problemático
            git revert --no-edit HEAD
            git push origin main
            exit 1
          fi
          echo "Análisis de seguridad superado. No hay secretos expuestos."

      - name: Levantar solo contenedores modificados
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Se han detectado cambios en los siguientes archivos:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"
          
          # Convertimos la lista de archivos separados por espacios a un bucle
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            # Extraemos la ruta de la carpeta base (quitamos 'docker-compose.yml')
            dir_path=$(dirname "$file")
            
            echo "---"
            echo "Levantando entorno en $dir_path..."
            cd $dir_path
            
            # Ejecutamos compose en background recreando el contenedor si el archivo ha cambiado.
            # --remove-orphans asegurará que si has borrado un servicio, lo detenga.
            docker compose up -d --remove-orphans
            
            # Volvemos a la raíz para el siguiente ciclo del bucle
            cd - > /dev/null
          done
          echo "---"
          echo "Todos los contenedores modificados han sido actualizados."
