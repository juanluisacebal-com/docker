name: CI/CD Stock Screener

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build stock_screener image
        run: |
          docker compose -f docker-compose.yml build stock_screener

      - name: Deploy stock_screener container
        run: |
          docker compose -f docker-compose.yml up -d stock_screener

      - name: Verify Streamlit is up
        run: |
          # Wait up to 30 seconds for the container to start
          for i in {1..10}; do
            curl -s -f http://localhost:8501 > /dev/null && echo "Streamlit is up!" && exit 0
            echo "Waiting for Streamlit..."
            sleep 3
          done
          echo "Streamlit didn't start in time. Aquí están los logs del contenedor:"
          docker logs stock_screener
          exit 1
